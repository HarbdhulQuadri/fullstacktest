# Render deployment blueprint (free tier).
# One Web Service runs Nest (serving the built frontend from the same origin)
# plus a free PostgreSQL database. Set JWT_SECRET and the admin seed credentials
# in the Render dashboard before first deploy.

services:
  - type: web
    name: fullstacktest
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && cd client && npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render installs with NODE_ENV=production, which omits devDependencies.
      # The build needs @nestjs/cli / typescript (and the client's vite / tsc),
      # so force dev deps to be installed.
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: fullstacktest-db
          property: connectionString
      - key: DB_SYNCHRONIZE
        value: 'false'
      - key: DB_MIGRATIONS_RUN
        value: 'true'
      - key: RATE_LIMIT
        value: '60'
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

databases:
  - name: fullstacktest-db
    plan: free
    databaseName: fullstacktest
    user: fullstacktest
